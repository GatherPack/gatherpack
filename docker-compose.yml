# Development dependencies only — the app itself runs on the host via bin/dev.
# For running GatherPack in production, see docker-compose.production.yml.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "password"
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"
